<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Comic+Relief:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <center>
    <div class="container">
        <div id="head">
            <h1>CALCULATOR</h1>
        </div>
        <div class="input">
            <input type="number" id="num1" placeholder="จำนวนตัวเลขที่1">
        </div>
        <div class="operator">
            <select id=" placeholder" name=" placeholder">
            <option value="บวก">บวก +</option>
            <option value="ลบ">ลบ -</option>
            <option value="คูณ">คูณ x</option>
            <option value="หาร">หาร /</option>
            </select>
        </div>
        <div class="input">
            <input type="number" id="num2" placeholder="จำนวนตัวเลขที่2">
        </div>
        <div class="button">
            <button onclick="result()">calculator</button>
        </div>
        <div id="answer">
            <h1 id="Answer" >ANSWER:</h1>
        </div>
    </div>
    </center>
        <script src="index.js"></script>
</body>
</html>
</html>
